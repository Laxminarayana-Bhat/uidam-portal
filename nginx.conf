events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        text/css
        text/javascript
        text/xml
        text/plain;

    server {
        listen       80;
        server_name  localhost;
        root         /usr/share/nginx/html;
        index        index.html;

        # Proxy session management APIs to the auth server
        # Avoids CORS by keeping requests same-origin from the browser's perspective.
        # The auth server URL is injected at deployment time via the NGINX_AUTH_SERVER_URL
        # environment variable (e.g. https://uidam-authorization-server.eks-ignite-dev.ic.aws.harmandev.com)
        location /sdp/ {
            proxy_pass ${NGINX_AUTH_SERVER_URL}/sdp/;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_server_name on;
        }

        # Runtime config is required by the SPA during bootstrap, but direct browser
        # navigation to /config.json should not expose the raw JSON page.
        # Browser navigations send Sec-Fetch-Dest=document and/or Accept=text/html;
        # fetch('/config.json') from the app does not, so the app can still start.
        location = /config.json {
            if ($http_sec_fetch_dest = "document") {
                return 302 /login;
            }
            if ($http_accept ~* "text/html") {
                return 302 /login;
            }

            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            try_files /config.json =404;
        }

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
